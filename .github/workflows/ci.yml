name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check, lint & schema validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check all packages
        run: npm run type-check

      - name: Lint all packages
        run: npm run lint

      - name: Validate Prisma schema
        run: cd apps/api && npx prisma validate

      - name: Check for Prisma schema drift
        # Requires DATABASE_URL — skip on forks or when secret is absent
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd apps/api && npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --exit-code || echo "Schema drift detected — run prisma migrate dev"
